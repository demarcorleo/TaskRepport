<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./CSS/index.css">
        <script src="./JS/script.js" async defer></script>
    </head>
    <body>
        <div class="logo-container">
            <div class="logo-wrapper">
                <img src="./IMG/Logo.jpeg" alt="Logo" class="logo"> 
            </div>
        </div>

        <div class="main-container">
            
            <div class = "container">
                <label for ="cia">Unidade:</label><br>
                <input type="text" id="cia" class="caixa-texto" readonly placeholder="RIG-1">
            </div>

            <div class = "container">
                <label for ="setor">Setor:</label><br>
                <select id="setor" class="caixa-texto">
                    <option value="1">150</option>
                    <option value="2">120</option>
                    <option value="3">100</option>
                    <option value="4">90</option>
                    <option value="5">50</option>
                </select>
            </div>

            <div class="container">
                <label for="tag">Tag:</label><br>
                <input type="text" id="tag" class="caixa-texto" autofocus>
            </div>

            <div class="container">
                <label for="report">Parte que falhou:</label><br>
                <input type="text" id="report" class="caixa-texto">
            </div>

            <div class="container">
                <label for="data">Falha percebida:</label><br>
                <input type="text" id="data" class="caixa-texto">
            </div>

            <div class="container">
                <label for="local">O que foi feito:</label><br>
                <input type="text" id="local" class="caixa-texto">
            </div>

            <div class="container">
                <label>Gerou parada:</label><br>
                <label class="radio-wrapper">
                    <input type="radio" name="gerou-parada" value="Sim" class="radio-personalizado">
                    <span>Sim</span>
                </label><br>
                <label class="radio-wrapper">
                    <input type="radio" name="gerou-parada" value="Não" class="radio-personalizado">
                    <span>Não</span>
                </label><br>
            
                <!-- Campo de data e hora dentro da mesma caixa -->
                <div id="data-parada" style="display: none; margin-top: 10px;">
                    <input type="datetime-local" id="dataParada" class="caixa-texto">
                </div>
            </div>
            
       
             
              
                               
            <div class="container">
                <label for="especialidade">Especialidade: </label><br>
                <select id="especialidade" class="caixa-texto">
                    <option value="Operação">Operação</option>
                    <option value="Elétrica">Elétrica</option>
                    <option value="Mecânica">Mecânica</option>
                    <option value="Qualidade">Qualidade</option>
                    <option value="Pintura">Pintura</option>
            </div>
        </div>
    </body>
</html>
